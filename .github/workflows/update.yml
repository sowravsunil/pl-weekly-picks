name: Update picks

# Every hour. GitHub runs scheduled jobs late or skips them when it is busy, so a frequent
# schedule is what makes sure each pick is published before kick-off. A run that finds
# nothing new changes nothing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.MODEL_REPO_TOKEN != '' }}
    steps:
      - name: Check setup
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::MODEL_REPO_TOKEN is not set, so there is nothing to update yet."

      - name: Check out the site
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          path: site

      - name: Check out the model
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: sowravsunil/pl-prediction-model
          token: ${{ secrets.MODEL_REPO_TOKEN }}
          path: model
          fetch-depth: 0

      - name: Set up Python
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        if: env.HAS_TOKEN == 'true'
        run: pip install -q -r model/requirements.txt > /dev/null

      # Output goes to a file that is saved to the model repo, not to this public log.
      - name: Refresh
        id: refresh
        if: env.HAS_TOKEN == 'true'
        run: |
          set +e
          bash model/scripts/run_pipeline.sh > run.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "Refresh finished."
          else
            echo "::error::Refresh stopped at a failed check. The log is saved in the model repo."
          fi

      - name: Publish the page
        id: publish
        if: env.HAS_TOKEN == 'true' && steps.refresh.outputs.status == '0'
        run: |
          cp -R model/docs/public/. site/
          cd site
          git add index.html fonts favicon.svg og.png apple-touch-icon.png
          files=$(git diff --cached --name-only)
          only_time=$(git diff --cached -U0 -- index.html | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'id="updated"' || true)
          if [ -z "$files" ] || { [ "$files" = "index.html" ] && [ -z "$only_time" ]; }; then
            git reset -q
            echo "No new content."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Update picks"
            git push -q
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Pages
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null 2>&1 || true

      - name: Save to the model repo
        if: env.HAS_TOKEN == 'true'
        run: |
          cd model
          git add data/raw/E0_*.csv docs/picks_history.csv docs/public \
                  docs/live_tracking.md docs/live_run_manifest.json docs/weekend_picks.md docs/dashboard.html
          # Commit when the data, the picks record or the page changed, or the run failed;
          # a run that only moved timestamps is not worth a commit.
          if [ "${{ steps.refresh.outputs.status }}" != "0" ] || \
             ! git diff --cached --quiet -- data/raw docs/picks_history.csv docs/public; then
            mkdir -p run_log && cp ../run.log run_log/last_run.txt && git add -f run_log/last_run.txt
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull -q --rebase && git push -q
          else
            echo "Nothing to save."
          fi
          [ "${{ steps.refresh.outputs.status }}" = "0" ]
